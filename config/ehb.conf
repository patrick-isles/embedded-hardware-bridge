# ==============================================================================
# Configuration: Embedded Hardware Bridge (EHB)
# Telemetry daemon and Prometheus exporter configuration
# ==============================================================================

[hardware]
# Serial device path (physical USB-to-UART bridge or HIL PTY loopback)
device = /tmp/ehb-virtual-uart
baudrate = 115200
timeout = 1.0

[exporter]
# Prometheus HTTP exporter host and port
host = 0.0.0.0
port = 9105
metrics_path = /metrics
telemetry_path = /api/telemetry

[thresholds]
# Electrical fault detection thresholds
overvoltage_trip_volts = 5.30
brownout_trip_volts = 4.50
thermal_trip_celsius = 75.0
max_current_amperes = 0.85

[adc]
# ADC hardware characteristics
reference_voltage_v = 5.00
adc_resolution_bits = 12
quantization_levels = 4096
lsb_millivolts = 1.2207
